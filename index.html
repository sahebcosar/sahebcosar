<div class="box" dir="rtl" style="font-family: Tahoma, sans-serif; max-width: 500px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08);">
  <h2 style="text-align: center; color: #333; margin-top: 0;">شنیده‌ها و سپاس‌ها</h2>
  <div id="result"></div>
  
  <form id="myForm">
    <label style="display: block; margin: 12px 0 6px; font-size: 14px; color: #444;">نوع پیام</label>
    <select name="type" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box;">
      <option value="پیشنهاد">پیشنهاد</option>
      <option value="انتقاد">انتقاد</option>
      <option value="تشکر">تشکر</option>
    </select>

    <label style="display: block; margin: 12px 0 6px; font-size: 14px; color: #444;">نام شما</label>
    <input type="text" name="name" placeholder="نام یا نام مستعار" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box;">

    <label style="display: block; margin: 12px 0 6px; font-size: 14px; color: #444;">متن پیام</label>
    <textarea name="message" placeholder="پیام خود را بنویسید..." required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; box-sizing: border-box; min-height: 110px; resize: vertical;"></textarea>

    <button type="submit" style="width: 100%; margin-top: 16px; padding: 12px; background: #2e7d32; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer;">ارسال پیام</button>
  </form>
</div>

<script>
// آدرس Worker شما اینجا قرار گرفت
const WORKER_URL = 'https://balefourm.amirsotudehs.workers.dev/'; 

document.getElementById('myForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const result = document.getElementById('result');
  const btn = form.querySelector('button');
  btn.disabled = true;
  result.innerHTML = '<div style="text-align:center; margin-bottom:10px; color:#666;">در حال ارسال...</div>';

  const payload = {
    type: form.type.value,
    name: form.name.value,
    message: form.message.value
  };
  
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    
    if (data.ok) {
      result.innerHTML = '<div style="background:#e8f5e9;color:#2e7d32;padding:12px;border-radius:8px;text-align:center;margin-bottom:10px;">✅ پیام شما با موفقیت ارسال شد. ممنون!</div>';
      form.reset();
    } else {
      result.innerHTML = '<div style="background:#ffebee;color:#c62828;padding:12px;border-radius:8px;text-align:center;margin-bottom:10px;">ارسال نشد. لطفاً دوباره تلاش کنید.</div>';
    }
  } catch (err) {
    result.innerHTML = '<div style="background:#ffebee;color:#c62828;padding:12px;border-radius:8px;text-align:center;margin-bottom:10px;">خطا در ارتباط با سرور.</div>';
  } finally {
    btn.disabled = false;
  }
});
</script>
