<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="description" content="خیمه‌گاه فاطمی | نذر روضه و تئاتر آیینی بانوی بی‌نشان - پویش هم‌عهدی ایام شهادت حضرت زهرا (س)">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:title" content="خیمه‌گاه فاطمی | تئاتر آیینی بانوی بی‌نشان">
  <meta property="og:description" content="نذر روضه و تئاتر آیینی بانوی بی‌نشان؛ پویش هم‌عهدی ایام شهادت حضرت زهرا (س)">
  <title>خیمه‌گاه فاطمی | تئاتر آیینی بانوی بی‌نشان</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
@font-face {
  font-family: "Vazirmatn";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url("https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn[wght].woff2") format("woff2");
}

:root {
  color-scheme: dark;
  --bg-deep: #050507;
  --bg-main: #09080b;
  --surface: #110d10;
  --surface-raised: #181115;
  --surface-inset: #0b080a;
  
  --crimson: #8f1424;
  --crimson-bright: #b81d33;
  --crimson-deep: #4a0811;
  
  --gold: #d4b475;
  --gold-soft: #a88d56;
  
  --ink: #f5f0f1;
  --muted: #c2b6b8;
  --quiet: #8c7e81;
  
  --border: #2b1a1f;
  --border-crimson: rgba(184, 29, 51, 0.42);
  --border-gold: rgba(212, 180, 117, 0.28);
  
  --radius-card: 14px;
  --radius-control: 9px;
  --content-width: 1140px;
  --page-gutter: clamp(16px, 3.5vw, 44px);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: 86px;
  scrollbar-color: var(--crimson) var(--bg-deep);
}

body {
  position: relative;
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  flex-direction: column;
  margin: 0;
  overflow-x: hidden;
  color: var(--ink);
  background-color: var(--bg-deep);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(143, 20, 36, 0.28), transparent 70%),
    radial-gradient(circle at 10% 35%, rgba(105, 11, 23, 0.16), transparent 45%),
    radial-gradient(circle at 90% 75%, rgba(105, 11, 23, 0.14), transparent 45%),
    linear-gradient(180deg, #0a0709 0%, var(--bg-deep) 100%);
  font-family: "Vazirmatn", Tahoma, sans-serif;
  font-size: 15px;
  line-height: 1.85;
}

/* سایر استایل‌های سایت (بدون تغییر) */
.skip-link { position: fixed; top: -100%; }
.global-header { position: sticky; top: 0; z-index: 100; display: flex; justify-content: center; border-bottom: 1px solid var(--border-crimson); background: rgba(8, 6, 8, 0.92); backdrop-filter: blur(14px); }
.site-nav { display: flex; gap: 20px; padding: 10px; }
.site-nav a { color: var(--muted); text-decoration: none; font-weight: 700; font-size: 0.85rem; }
main { display: flex; flex-direction: column; gap: 24px; padding: 28px var(--page-gutter); max-width: var(--content-width); margin: auto; }
.hero-card, .salavat-counter-box { border: 1px solid var(--border-crimson); border-radius: var(--radius-card); background: linear-gradient(160deg, var(--surface-raised), var(--surface)); padding: 30px; text-align: center; }
.salavat-display { width: 130px; height: 130px; margin: 20px auto; border-radius: 50%; background: rgba(10,6,8,0.6); display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
#salavatCount { font-size: 3.5rem; font-weight: 900; color: #fff; text-shadow: 0 4px 15px rgba(184, 29, 51, 0.6); transition: transform 0.1s ease; }
.salavat-btn { min-width: 200px; min-height: 52px; background: linear-gradient(135deg, #b81d33, #6e0d1b); color: #fff; border: none; border-radius: 999px; font-weight: 800; font-size: 1rem; cursor: pointer; position: relative; overflow: hidden; }
.salavat-btn:active { transform: scale(0.97); }
.salavat-btn.is-cooling { filter: grayscale(0.6); cursor: not-allowed; }
.network-debugger { position: fixed; bottom: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 8px 12px; border-radius: 8px; border: 1px solid #444; font-size: 0.75rem; color: #fff; z-index: 10000; direction: rtl; }
</style>
</head>
<body>

  <header class="global-header">
    <nav class="site-nav">
      <a href="#salavatSection">صلوات شمار</a>
    </nav>
  </header>

  <main id="mainContent">
    <div class="hero-card">
      <h1 style="color: #fff; margin:0;">نذر روضه و تئاتر آیینی</h1>
      <p style="color: var(--muted);">هم‌عهدی ایام شهادت حضرت زهرا (س)</p>
    </div>

    <!-- صلوات شمار -->
    <div class="salavat-counter-box" id="salavatSection">
      <h2 style="color: var(--gold);">هم‌عهدی با صلوات</h2>
      <div class="salavat-display">
        <div id="salavatCount">0</div>
      </div>
      <button id="salavatBtn" class="salavat-btn">صلوات نذر کن</button>
    </div>
  </main>

  <!-- پنل عیب‌یاب هوشمند شبکه -->
  <div id="networkDebugger" class="network-debugger">
    وضعیت سرور: <span id="serverStatus" style="color: #ffd700;">در حال اتصال... ⏳</span>
  </div>

  <script>
    const countDisplay = document.getElementById('salavatCount');
    const btn = document.getElementById('salavatBtn');
    const serverStatus = document.getElementById('serverStatus');
    
    // شناسه اختصاصی و دیتابیس رایگان (CounterAPI)
    const NAMESPACE = 'sabco_fatemiye_1405_v5'; 
    const KEY = 'salavat';
    const API_URL = `https://api.counterapi.dev/v1/${NAMESPACE}/${KEY}`;

    let localCount = 0;
    let isCooling = false;

    // تابع آپدیت وضعیت شبکه
    function setStatus(msg, color) {
        serverStatus.textContent = msg;
        serverStatus.style.color = color;
    }

    // گرفتن آمار زنده از سرور
    function fetchCount() {
      // این بخش "?=" باعث می‌شود گوشی مجبور شود دیتای جدید را بگیرد و کش نکند
      const noCacheUrl = API_URL + '?_=' + new Date().getTime();
      
      fetch(noCacheUrl, { cache: 'no-store' })
        .then(response => {
            if(!response.ok) throw new Error("خطای سرور");
            return response.json();
        })
        .then(data => {
          if (data && data.count !== undefined) {
             setStatus("متصل و زنده 🟢", "#00ff00"); // سبز
             if (data.count > localCount || localCount === 0) {
               localCount = data.count;
               countDisplay.textContent = localCount;
             }
          }
        })
        .catch(err => {
            setStatus("اینترنت شما API را فیلتر کرده 🔴", "#ff4444"); // قرمز
            console.error(err);
        });
    }
    
    // رفرش کردن آمار هر ۲ ثانیه
    fetchCount();
    setInterval(fetchCount, 2000);

    // کلیک روی دکمه
    btn.addEventListener('click', () => {
      if (isCooling) return;
      
      // قفل کردن ۱ ثانیه‌ای دکمه
      isCooling = true;
      btn.classList.add('is-cooling');
      setTimeout(() => {
          isCooling = false;
          btn.classList.remove('is-cooling');
      }, 1000);

      // آپدیت سریع روی گوشی برای حس سرعت
      localCount++;
      countDisplay.textContent = localCount;
      countDisplay.style.transform = 'scale(1.1)';
      setTimeout(() => countDisplay.style.transform = 'scale(1)', 150);

      // ارسال عدد به سرور
      const noCacheUpUrl = API_URL + '/up?_=' + new Date().getTime();
      fetch(noCacheUpUrl, { cache: 'no-store' })
        .then(res => res.json())
        .then(data => {
            if(data && data.count) localCount = data.count;
        })
        .catch(err => {
            setStatus("خطا در ثبت (فیلترینگ) 🔴", "#ff4444");
        });
    });
  </script>
</body>
</html>
