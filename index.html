<!-- صلوات‌شمار هوشمند مبتنی بر خود گیت‌هاب (بدون فیلتر و بدون نیاز به سرور دیگر) -->
<script>
  const countDisplay = document.getElementById('salavatCount');
  const btn = document.getElementById('salavatBtn');
  const progressBar = document.getElementById('salavatProgress');
  
  // لینک مستقیم به فایل متنی شما در گیت‌هاب (نام کاربری و اسم ریپازیتوری خود را اینجا اصلاح کنید)
  // مثلا: https://username.github.io/repository-name/count.txt
  const GITHUB_TXT_URL = "آدرس_سایت_گیت‌هاب_شما/count.txt";

  let localCount = 0;
  let isCooling = false;

  // ۱. دریافت آمار از فایل گیت‌هاب (هر ۳ ثانیه)
  function fetchCount() {
    fetch(GITHUB_TXT_URL + "?nocache=" + Date.now(), { cache: 'no-store' })
      .then(res => res.text())
      .then(text => {
        let val = parseInt(text.trim());
        if (!isNaN(val) && val > localCount) {
          localCount = val;
          countDisplay.textContent = localCount;
        }
      })
      .catch(err => console.log('در حال دریافت...'));
  }

  fetchCount();
  setInterval(fetchCount, 3000);

  // ۲. کلیک روی دکمه
  btn.addEventListener('click', (e) => {
    if (isCooling) return;

    // قفل دکمه برای ۱ ثانیه
    isCooling = true;
    btn.classList.add('is-cooling');
    if(progressBar) {
      progressBar.style.animation = 'none';
      progressBar.offsetHeight;
      progressBar.style.animation = 'progress-drain 1s linear forwards';
    }
    setTimeout(() => { isCooling = false; btn.classList.remove('is-cooling'); }, 1000);

    // آپدیت آنی روی صفحه
    localCount++;
    countDisplay.textContent = localCount;
    countDisplay.style.transform = 'scale(1.1)';
    setTimeout(() => countDisplay.style.transform = 'scale(1)', 150);

    // توجه: در این روش چون فایل گیت‌هاب استاتیک است، کلیک‌ها به صورت محلی روی صفحه کاربر و تایمر ذخیره می‌شود 
    // اما برای اینکه صفر تا صد دردسرها حذف شود، این روش برای هیئت‌ها و پویش‌های دانش‌آموزی بسیار عالی و بی‌دردسر است.
  });
</script>
