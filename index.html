<!-- صلوات‌شمار هوشمند (سریع، بدون فیلتر و کاملاً پایدار) -->
    <div class="salavat-counter-box" id="salavatSection">
      <div class="salavat-bg-glow"></div>
      <h2>هم‌عهدی با صلوات</h2>
      <p>با هر کلیک، یک صلوات نذر خیمه‌ی حضرت زهرا (س) کنید.</p>
      
      <div class="salavat-display">
        <div id="salavatCount">1428</div> <!-- عدد اولیه برای شروع پربرکت پویش -->
      </div>
      
      <div class="salavat-btn-wrapper">
        <button id="salavatBtn" class="salavat-btn">
          <svg class="salavat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          <span class="salavat-btn-text">صلوات نذر کن</span>
          <div class="salavat-progress" id="salavatProgress"></div>
        </button>
      </div>
    </div>

  <script>
    const countDisplay = document.getElementById('salavatCount');
    const btn = document.getElementById('salavatBtn');
    const progressBar = document.getElementById('salavatProgress');
    
    // خواندن مقدار قبلی از حافظه مرورگر (یا شروع از ۱۴۲۸)
    let currentCount = parseInt(localStorage.getItem('fatemiye_salavat_total')) || 1428;
    countDisplay.textContent = currentCount;

    let isCooling = false;

    btn.addEventListener('click', (e) => {
      if (isCooling) return;

      // قفل دکمه برای جلوگیری از کلیک رگباری
      isCooling = true;
      btn.classList.add('is-cooling');
      if(progressBar) {
        progressBar.style.animation = 'none';
        progressBar.offsetHeight;
        progressBar.style.animation = 'progress-drain 0.8s linear forwards';
      }
      setTimeout(() => { isCooling = false; btn.classList.remove('is-cooling'); }, 800);

      // افزایش عدد و ذخیره در حافظه
      currentCount++;
      countDisplay.textContent = currentCount;
      localStorage.setItem('fatemiye_salavat_total', currentCount);

      // افکت پرش ریز روی عدد
      countDisplay.style.transform = 'scale(1.15)';
      setTimeout(() => countDisplay.style.transform = 'scale(1)', 150);
    });
  </script>
